      .boot-shell {
        min-height: 100vh;

      .boot-logo-wrap {

      .boot-logo {

        place-items: center;
        background: linear-gradient(135deg, #ef4444, #b91c1c);
        color: white;
        font-weight: 900;
        font-size: 32px;
        box-shadow: 0 20px 60px rgba(220, 38, 38, 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #ef4444;
        border-right-color: rgba(239, 68, 68, 0.35);
        animation: boot-spin 1s linear infinite;
      }
      .boot-title {
        margin: 0;
        color: #ffffff;
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .boot-subtitle {
        margin: 0;
        color: #64748b;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .boot-dots { display: inline-flex; gap: 6px; margin-top: 4px; }
      .boot-dots span {
        width: 6px; height: 6px; border-radius: 50%;
        background: #ef4444;
        animation: boot-bounce 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) { animation-delay: 0.15s; }
      .boot-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(220,38,38,0.45), inset 0 1px 0 rgba(255,255,255,0.15); }
        50% { transform: scale(1.06); box-shadow: 0 24px 72px rgba(220,38,38,0.65), inset 0 1px 0 rgba(255,255,255,0.2); }
      }
      @keyframes boot-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
